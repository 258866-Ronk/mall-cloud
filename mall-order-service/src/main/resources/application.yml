server.port: 9005
spring:
 application.name: mall-order-service
 cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
 datasource:
  url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/mall_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  username: ${MYSQL_USER:root}
  password: ${MYSQL_PASSWORD:mall123456}
 sql.init.mode: always
 data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
 rabbitmq:
  host: ${RABBIT_HOST:localhost}
  port: ${RABBIT_PORT:5672}
  username: ${RABBIT_USER:mall}
  password: ${RABBIT_PASSWORD:mall123456}
  listener.simple:
   acknowledge-mode: auto
   retry.enabled: true
   retry.max-attempts: 5
mybatis-plus.configuration.map-underscore-to-camel-case: true
management.endpoints.web.exposure.include: health,info
