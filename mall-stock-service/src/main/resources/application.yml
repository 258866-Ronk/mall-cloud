server.port: 9004
spring:
  application.name: mall-stock-service
  cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/mall_stock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mall123456}
  sql.init.mode: always
mybatis-plus.configuration.map-underscore-to-camel-case: true
management.endpoints.web.exposure.include: health,info
