server.port: 9001
spring:
  application.name: mall-user-service
  cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/mall_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mall123456}
  sql.init.mode: always
mybatis-plus:
  configuration.map-underscore-to-camel-case: true
  global-config.db-config.logic-delete-field: deleted
management.endpoints.web.exposure.include: health,info
